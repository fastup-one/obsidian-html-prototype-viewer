name: Release (draft)

# Pushing a tag equal to manifest.json's version (no "v" prefix, e.g. 1.0.1-strict.1)
# tests, builds, sweeps and packages the plugin, attests the build provenance and
# creates a DRAFT release with the package. Nothing becomes public until someone
# publishes the draft by hand; collaborators can download it from the Releases page.
#
# The package is byte-for-byte reproducible: its SHA-256 must match the one of the
# package built locally from the same commit (`npm run package`).

on:
  push:
    tags: ["*"]

permissions: {}

jobs:
  release:
    name: Build and create the draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies from the lockfile, without install scripts
        run: npm ci --ignore-scripts
      - name: Check that the tag matches manifest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const v = require("./manifest.json").version; if (v !== process.env.TAG) { console.error(`Tag ${process.env.TAG} does not match manifest version ${v}`); process.exit(1); }'
      - name: Test, build and sweep the bundle
        run: npm run check
      - name: Package
        run: npm run package
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            main.js
            manifest.json
            styles.css
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip main.js manifest.json styles.css \
            --draft --verify-tag --title "$TAG" --generate-notes
