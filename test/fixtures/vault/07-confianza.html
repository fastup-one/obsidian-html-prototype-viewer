<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de confianza</title>
<style>
	body { font: 16px system-ui, sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
	#banner { font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 10px; color: #fff; background: #555; }
	.isolated { background: #0a7d32 !important; }
	.trusted { background: #b26a00 !important; }
</style>
</head>
<body>
<div id="banner">Comprobando…</div>
<p id="detail"></p>
<script>
	(function () {
		var banner = document.getElementById("banner");
		var detail = document.getElementById("detail");
		var count = null;
		try {
			count = Number(localStorage.getItem("hpv-visits") || "0") + 1;
			localStorage.setItem("hpv-visits", String(count));
		} catch (e) {}
		if (count === null) {
			banner.textContent = "🛡️ Aislado: esta página no puede guardar nada";
			banner.className = "isolated";
			detail.textContent = "Es lo normal. Si confías en este archivo (botón del escudo, arriba), podrá recordar cuántas veces lo has abierto.";
		} else {
			banner.textContent = "Sin aislamiento: has abierto esta página " + count + " vez/veces";
			banner.className = "trusted";
			detail.textContent = "Recarga la página: el número debe subir. Para volver a aislarla, pulsa el escudo de arriba.";
		}
		document.title = banner.textContent;
	})();
</script>
</body>
</html>
