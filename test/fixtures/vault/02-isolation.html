<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isolation check</title>
<script>window.__violations = []; document.addEventListener("securitypolicyviolation", function (e) { window.__violations.push(e.effectiveDirective); });</script>
<style>
	:root:not([data-lang="es"]) .es { display: none !important; }
	:root[data-lang="es"] .en { display: none !important; }
	body { font: 16px system-ui, sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
	.langsw { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 12px; }
	.langsw button { font: 600 12px system-ui, sans-serif; padding: 3px 9px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #333; cursor: pointer; }
	.langsw button[aria-pressed="true"] { background: #333; border-color: #333; color: #fff; }
	#banner { font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 10px; color: #fff; background: #777; }
	.green { background: #0a7d32 !important; }
	.amber { background: #b26a00 !important; }
	.red { background: #b00020 !important; }
	ul { padding-left: 1.2em; }
	li { margin: 6px 0; }
</style>
</head>
<body>
<div class="langsw" role="group" aria-label="Language · Idioma"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button></div>
<div id="banner">Checking… · Comprobando…</div>
<p id="explain"></p>
<ul id="list"></ul>
<img src="https://example.invalid/pixel.png" alt="" style="display:none">
<script>
	// Self-check for html-prototype-viewer-strict. Every network probe targets
	// example.invalid, a reserved name that never resolves.
	(function () {
		var lang = "en";
		function T(en, es) { return lang === "es" ? es : en; }
		var rows = [];
		var violations = window.__violations;
		var verdict = null;
		function row(blocked, en, es) { rows.push({ blocked: blocked, en: en, es: es }); }

		var isolated = self.origin === "null";

		var reachesObsidian = false;
		try { reachesObsidian = !!(window.parent.app || window.parent.document.body); } catch (e) {}
		row(!reachesObsidian, "Access to Obsidian and your vault", "Acceso a Obsidian y a tu vault");

		var storage = false;
		try { localStorage.setItem("hpv-test", "1"); storage = localStorage.getItem("hpv-test") === "1"; } catch (e) {}
		row(!storage, "Storing data (localStorage)", "Guardar datos (localStorage)");

		if (isolated) {
			var popup = null;
			try { popup = window.open("https://example.invalid/window"); } catch (e) {}
			row(!popup, "Opening new windows", "Abrir ventanas nuevas");
			var started = Date.now();
			try { alert("If you can read this, dialogs are NOT blocked. · Si ves este mensaje, los diálogos NO están bloqueados."); } catch (e) {}
			row(Date.now() - started < 300, "alert/confirm/prompt dialogs", "Diálogos alert/confirm/prompt");
		}

		var fetchOk = false;
		fetch("https://example.invalid/data").then(function () { fetchOk = true; }, function () {});

		function render() {
			var list = document.getElementById("list");
			list.textContent = "";
			rows.forEach(function (r) {
				var li = document.createElement("li");
				li.textContent = (r.blocked ? T("🔒 Blocked: ", "🔒 Bloqueado: ") : T("🔓 Allowed: ", "🔓 Permitido: ")) + T(r.en, r.es);
				list.appendChild(li);
			});
			if (!verdict) return;
			var banner = document.getElementById("banner");
			banner.textContent = T(verdict.en, verdict.es);
			banner.className = verdict.cls;
			document.getElementById("explain").textContent = T(verdict.explainEn, verdict.explainEs);
			document.title = banner.textContent;
		}

		setTimeout(function () {
			var blockedByCsp = violations.indexOf("connect-src") !== -1 || violations.indexOf("default-src") !== -1;
			row(!fetchOk && blockedByCsp, "Connecting to the internet", "Conectarse a internet");
			row(violations.indexOf("img-src") !== -1, "Loading images from the internet", "Cargar imágenes de internet");
			var allBlocked = rows.every(function (r) { return r.blocked; });
			if (reachesObsidian) {
				verdict = { cls: "red", en: "🔴 RED: this HTML can reach Obsidian and your vault", es: "🔴 ROJO: este HTML puede acceder a Obsidian y a tu vault",
					explainEn: "Expected only for a trusted file on mobile. If you did not trust it, report it.",
					explainEs: "Solo debería pasar con un archivo de confianza en el móvil. Si no confiaste en él, avisa." };
			} else if (isolated && allBlocked) {
				verdict = { cls: "green", en: "🟢 GREEN: properly isolated", es: "🟢 VERDE: aislado correctamente",
					explainEn: "Everything is blocked, as it should be for a file you have not trusted.",
					explainEs: "Todo está bloqueado, como debe ser para un archivo en el que no has confiado." };
			} else if (!isolated) {
				verdict = { cls: "amber", en: "🟠 AMBER: not isolated, but no access to Obsidian", es: "🟠 ÁMBAR: sin aislamiento, pero sin acceso a Obsidian",
					explainEn: "Expected for a trusted file on desktop.",
					explainEs: "Es lo esperado para un archivo de confianza en el escritorio." };
			} else {
				verdict = { cls: "red", en: "🔴 RED: isolated, but something is not blocked", es: "🔴 ROJO: aislado, pero algo no está bloqueado",
					explainEn: "Report it: something that should be blocked is not.",
					explainEs: "Avisa: algo que debería estar bloqueado no lo está." };
			}
			render();
		}, 800);

		function setLang(l) {
			lang = l === "es" ? "es" : "en";
			document.documentElement.setAttribute("data-lang", lang);
			document.documentElement.lang = lang;
			document.querySelectorAll(".langsw button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === lang)); });
			render();
		}
		document.querySelectorAll(".langsw button").forEach(function (b) { b.addEventListener("click", function () { setLang(b.getAttribute("data-l")); }); });
	})();
</script>
</body>
</html>
