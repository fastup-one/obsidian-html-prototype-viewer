<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de aislamiento</title>
<script>window.__violations = []; document.addEventListener("securitypolicyviolation", function (e) { window.__violations.push(e.effectiveDirective); });</script>
<style>
	body { font: 16px system-ui, sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
	#banner { font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 10px; color: #fff; background: #777; }
	.green { background: #0a7d32 !important; }
	.amber { background: #b26a00 !important; }
	.red { background: #b00020 !important; }
	ul { padding-left: 1.2em; }
	li { margin: 6px 0; }
</style>
</head>
<body>
<div id="banner">Comprobando…</div>
<p id="explain"></p>
<ul id="list"></ul>
<img src="https://example.invalid/pixel.png" alt="" style="display:none">
<script>
	// Self-check for html-prototype-viewer-strict. Every network probe targets
	// example.invalid, a reserved name that never resolves.
	(function () {
		var rows = [];
		var violations = window.__violations;
		function row(blocked, text) { rows.push({ blocked: blocked, text: text }); }

		var isolated = self.origin === "null";

		var reachesObsidian = false;
		try { reachesObsidian = !!(window.parent.app || window.parent.document.body); } catch (e) {}
		row(!reachesObsidian, "Acceso a Obsidian y a tu vault");

		var storage = false;
		try { localStorage.setItem("hpv-test", "1"); storage = localStorage.getItem("hpv-test") === "1"; } catch (e) {}
		row(!storage, "Guardar datos (localStorage)");

		if (isolated) {
			var popup = null;
			try { popup = window.open("https://example.invalid/ventana"); } catch (e) {}
			row(!popup, "Abrir ventanas nuevas");
			var started = Date.now();
			try { alert("Si ves este mensaje, los diálogos NO están bloqueados."); } catch (e) {}
			row(Date.now() - started < 300, "Diálogos alert/confirm/prompt");
		}

		var fetchDone = false, fetchOk = false;
		fetch("https://example.invalid/datos").then(function () { fetchOk = true; }, function () {}).then(function () { fetchDone = true; });

		setTimeout(function () {
			var blockedByCsp = violations.indexOf("connect-src") !== -1 || violations.indexOf("default-src") !== -1;
			row(!fetchOk && blockedByCsp, "Conectarse a internet");
			row(violations.indexOf("img-src") !== -1, "Cargar imágenes de internet");

			var list = document.getElementById("list");
			rows.forEach(function (r) {
				var li = document.createElement("li");
				li.textContent = (r.blocked ? "🔒 Bloqueado: " : "🔓 Permitido: ") + r.text;
				list.appendChild(li);
			});

			var banner = document.getElementById("banner");
			var explain = document.getElementById("explain");
			var allBlocked = rows.every(function (r) { return r.blocked; });
			if (reachesObsidian) {
				banner.textContent = "🔴 ROJO: este HTML puede acceder a Obsidian y a tu vault";
				banner.className = "red";
				explain.textContent = "Solo debería pasar con un archivo de confianza en el móvil. Si no confiaste en él, avisa.";
			} else if (isolated && allBlocked) {
				banner.textContent = "🟢 VERDE: aislado correctamente";
				banner.className = "green";
				explain.textContent = "Todo está bloqueado, como debe ser para un archivo en el que no has confiado.";
			} else if (!isolated) {
				banner.textContent = "🟠 ÁMBAR: sin aislamiento, pero sin acceso a Obsidian";
				banner.className = "amber";
				explain.textContent = "Es lo esperado para un archivo de confianza en el escritorio.";
			} else {
				banner.textContent = "🔴 ROJO: aislado, pero algo no está bloqueado";
				banner.className = "red";
				explain.textContent = "Avisa: algo que debería estar bloqueado no lo está.";
			}
			document.title = banner.textContent;
		}, 800);
	})();
</script>
</body>
</html>
