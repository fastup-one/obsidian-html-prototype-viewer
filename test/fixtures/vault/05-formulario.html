<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formularios</title>
<style>
	body { font: 16px system-ui, sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
	form { margin: 16px 0; padding: 14px; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
	.result { margin-top: 8px; font-weight: 700; }
	.green { color: #0a7d32; }
	.red { color: #b00020; }
</style>
</head>
<body>
<h1>Formularios</h1>

<form id="local">
	<p>1. Formulario que se gestiona dentro de la página (debe <strong>funcionar</strong>):</p>
	<input id="name" value="Prueba"> <button>Enviar</button>
	<div class="result" id="localResult"></div>
</form>

<form id="remote" action="https://example.invalid/enviar" method="post">
	<p>2. Formulario que intenta enviar datos a internet (debe quedar <strong>bloqueado</strong>):</p>
	<input name="secreto" value="dato"> <button>Enviar fuera</button>
	<div class="result" id="remoteResult"></div>
</form>

<script>
	document.getElementById("local").addEventListener("submit", function (e) {
		e.preventDefault();
		var r = document.getElementById("localResult");
		r.textContent = "🟢 Funciona: recibido «" + document.getElementById("name").value + "»";
		r.className = "result green";
	});
	document.addEventListener("securitypolicyviolation", function (e) {
		if (e.effectiveDirective !== "form-action") return;
		var r = document.getElementById("remoteResult");
		r.textContent = "🟢 Bloqueado: no ha salido nada";
		r.className = "result green";
	});
</script>
</body>
</html>
