<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trust check</title>
<style>
	:root:not([data-lang="es"]) .es { display: none !important; }
	:root[data-lang="es"] .en { display: none !important; }
	body { font: 16px system-ui, sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
	.langsw { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 12px; }
	.langsw button { font: 600 12px system-ui, sans-serif; padding: 3px 9px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #333; cursor: pointer; }
	.langsw button[aria-pressed="true"] { background: #333; border-color: #333; color: #fff; }
	#banner { font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 10px; color: #fff; background: #555; }
	.isolated { background: #0a7d32 !important; }
	.trusted { background: #b26a00 !important; }
</style>
</head>
<body>
<div class="langsw" role="group" aria-label="Language · Idioma"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button></div>
<div id="banner">Checking… · Comprobando…</div>
<p id="detail"></p>
<script>
	(function () {
		var lang = "en";
		function T(en, es) { return lang === "es" ? es : en; }
		var count = null;
		try {
			count = Number(localStorage.getItem("hpv-visits") || "0") + 1;
			localStorage.setItem("hpv-visits", String(count));
		} catch (e) {}
		function render() {
			var banner = document.getElementById("banner");
			var detail = document.getElementById("detail");
			if (count === null) {
				banner.textContent = T("🛡️ Isolated: this page cannot store anything", "🛡️ Aislado: esta página no puede guardar nada");
				banner.className = "isolated";
				detail.textContent = T(
					"That is normal. If you trust this file (shield button, at the top), it will remember how many times you opened it.",
					"Es lo normal. Si confías en este archivo (botón del escudo, arriba), podrá recordar cuántas veces lo has abierto.");
			} else {
				banner.textContent = T("Not isolated: you have opened this page " + count + " time(s)", "Sin aislamiento: has abierto esta página " + count + " vez/veces");
				banner.className = "trusted";
				detail.textContent = T(
					"Reload the page: the number must go up. To isolate it again, click the shield at the top.",
					"Recarga la página: el número debe subir. Para volver a aislarla, pulsa el escudo de arriba.");
			}
			document.title = banner.textContent;
		}
		render();
		document.querySelectorAll(".langsw button").forEach(function (b) {
			b.addEventListener("click", function () {
				lang = b.getAttribute("data-l") === "es" ? "es" : "en";
				document.documentElement.setAttribute("data-lang", lang);
				document.documentElement.lang = lang;
				document.querySelectorAll(".langsw button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
				render();
			});
		});
	})();
</script>
</body>
</html>
